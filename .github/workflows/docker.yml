name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One build after the other, so two pushes never get the same version
concurrency:
  group: docker-image
  cancel-in-progress: false

# The actions are named by their commit, a changed tag can not change what runs here
# with the right to write the image. Dependabot proposes new ones.
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Every build is the next patch version: the major and minor version come
      # from package.json, the patch is one more than the last tag of that
      # series. A new major or minor version is written into package.json, its
      # first build gets the patch written there (1.1.0).
      - name: Version
        id: version
        run: |
          base=$(jq -r .version package.json)
          series=${base%.*}
          patch=${base##*.}
          last=$(git ls-remote --tags --refs origin "refs/tags/v$series.*" \
            | sed 's|.*refs/tags/v||' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | cut -d. -f3 | sort -n | tail -1)
          if [ -n "$last" ] && [ "$((last + 1))" -gt "$patch" ]; then
            patch=$((last + 1))
          fi
          echo "version=$series.$patch" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Before anything is published: start the image the way the compose file
      # does, without privileges and with a read-only filesystem, and ask it
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: shelv-web:test
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha

      - name: Start the image like the compose file and ask it
        run: |
          mkdir cache config logs
          docker run -d --name shelv \
            --user "$(id -u):$(id -g)" \
            --security-opt no-new-privileges:true --cap-drop ALL \
            --read-only --tmpfs /tmp --pids-limit 200 \
            -e NAVIDROME_URL=http://127.0.0.1:4533 \
            -v "$PWD/cache:/cache" -v "$PWD/config:/config" -v "$PWD/logs:/logs" \
            -p 8080:8080 shelv-web:test
          for attempt in $(seq 30); do
            curl -fsS http://127.0.0.1:8080/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS http://127.0.0.1:8080/ | grep -q 'window.APP_CONFIG'
          curl -sSI http://127.0.0.1:8080/ | grep -qi 'content-security-policy'
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/lyrics/stats)" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8080/rest/getAlbumList2?u=a&p=b')" = 401
          ls config
          docker logs shelv
          docker rm -f shelv

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Only latest: with a second tag GitHub shows that one in "Install from the command line"
          tags: ghcr.io/gatzenga/shelv-web:latest
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Only a published image gets its version as a tag, a failed build gives its
  # number to the next one
  tag:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Tag the version
        env:
          VERSION: v${{ needs.build.outputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"
