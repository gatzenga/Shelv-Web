name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# The actions are named by their commit, a changed tag can not change what runs here
# with the right to write the image. Dependabot proposes new ones.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Before anything is published: start the image the way the compose file
      # does, without privileges and with a read-only filesystem, and ask it
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: shelv-web:test
          cache-from: type=gha

      - name: Start the image like the compose file and ask it
        run: |
          mkdir cache config logs
          docker run -d --name shelv \
            --user "$(id -u):$(id -g)" \
            --security-opt no-new-privileges:true --cap-drop ALL \
            --read-only --tmpfs /tmp --pids-limit 200 \
            -e NAVIDROME_URL=http://127.0.0.1:4533 \
            -v "$PWD/cache:/cache" -v "$PWD/config:/config" -v "$PWD/logs:/logs" \
            -p 8080:8080 shelv-web:test
          for attempt in $(seq 30); do
            curl -fsS http://127.0.0.1:8080/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS http://127.0.0.1:8080/ | grep -q 'window.APP_CONFIG'
          curl -sSI http://127.0.0.1:8080/ | grep -qi 'content-security-policy'
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/lyrics/stats)" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8080/rest/getAlbumList2?u=a&p=b')" = 401
          ls config
          docker logs shelv
          docker rm -f shelv

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/gatzenga/shelv-web:latest
            ghcr.io/gatzenga/shelv-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
